<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Slack Theme</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="Slack Logo" class="logo">
    <div class="titles">
      <h2>Slack Theme</h2>
      <p>for Messenger</p>
    </div>
  </div>

  <div class="content">
    <div class="control-row">
      <span class="label">Bật giao diện Slack</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span>Tương thích Messenger.com & Facebook Messages</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
